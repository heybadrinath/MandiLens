[project]
name = "mandilens"
version = "0.1.0"
description = "Batch data and forecasting pipeline for Maharashtra mandi prices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "httpx>=0.28,<0.29",
    "joblib>=1.5,<2",
    "polars>=1.35,<2",
    "pydantic>=2.12,<3",
    "scikit-learn>=1.8,<2",
]

[project.scripts]
mandilens-pipeline = "mandilens_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines/src/mandilens_pipeline"]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mandilens_pipeline"]
mypy_path = "pipelines/src"
warn_unused_ignores = false
